# LLM Relay 配置示例
# Docker 部署下多数项由 .env 环境变量覆盖，此文件供裸机/自定义部署使用。
server:
  host: 127.0.0.1
  port: 8888
  mode: release
  # 看板上的带宽读数取哪张网卡；留空 = 自动选择承载默认路由的那张。
  # 多网卡机器（专线 + 家宽、WiFi 备份）上默认路由未必是你在看的那条链路，
  # 采错网卡时读数看起来完全正常、只是答的不是你问的问题 —— 这种错误在界面上
  # 没有任何痕迹，所以需要时显式指定。Linux 填 eth0 / ens18，
  # Windows 填「以太网 2」这种显示名（与 ipconfig 里的一致）。
  # 填错时管理台会直接显示可用网卡列表。
  # bandwidth_interface: eth0
  # 公网/反代部署时设置为浏览器访问管理台的固定来源，例如 https://relay.example.com。
  # public_origin: https://relay.example.com
  # trusted_proxies: ["127.0.0.1", "::1"]
  # 经 nginx/caddy 反代时按它采信 X-Forwarded-For 解析真实客户端 IP
  # （管理台登录限流按 IP 计数）。默认只信回环；直连部署不用改。
  # trusted_proxies: ["127.0.0.1", "::1"]

database:
  host: 127.0.0.1
  port: 5432
  user: llmrelay
  password: ""
  dbname: llm_relay
  sslmode: disable
  timezone: UTC

relay:
  upstream_timeout: 300s
  first_byte_timeout: 120s
  max_retries: 2
  max_request_body_mb: 64
  log_retention_days: 30
  payload_storage_mode: errors
  # 故障转移到**同一台上游**时的等待。
  #
  # 两条渠道共用同一个 base_url 时，「换渠道」在上游看来就是同一个端点
  # 又被连打一次，那是上游判定我们攻击、直接熔断的形态。切到别的上游
  # 则不等 —— 那不会给谁造成压力，白等只是让用户多等。
  # 0 表示关闭（回到「零间隔重试」的旧行为）。
  retry_same_upstream_delay: 500ms
  # 客户端显示映射的进程内缓存（键来自 UA 派生的客户端标识）。
  # 容量满时淘汰最久未使用的条目，不会拒绝新客户端；
  # 超过 TTL 没再被观测到的条目自动退场（0 = 不过期，只靠容量淘汰）。
  # 真实部署里不同客户端以「几十」计，默认值很宽松；
  # 公网多租户、或日志里出现大量随机 UA 时可适当调大。
  client_map_limit: 2048
  client_map_ttl: 168h

security:
  # AES-GCM 加密上游渠道密钥的主密钥；生产环境务必换成随机长字符串。
  secret: llm-relay-dev-secret-change-me
  # 管理台登录密钥（无账号模型）：浏览器打开管理台时输入它登录。
  # 留空 = 关闭登录鉴权（仅建议在只绑回环的本地部署下）；
  # 部署到公网必须设置，至少 16 位，且不能与 secret 相同。
  # 轮换并重启后，所有已登录会话立即失效。
  # admin_key: change-me-to-a-long-random-string
  # 登录会话有效期（Go duration 写法），默认 168h，上限 720h。
  # session_ttl: 168h

log:
  level: info
  format: text
