name: CI

# ============================================================
#  日常检查：push 到 main 与所有 PR
#
#  与 release.yml 的分工：
#    · 这里只管「代码是不是好的」—— 不发布、不推镜像、不改文件
#    · release.yml 在打 tag 时才跑，并在发布前跑一遍同样的测试当守门员
#
#  三个 job 各自独立（没有 needs）：后端与前端互不依赖，
#  并行跑能把反馈时间压到最短。任何一个失败都会让整个 workflow 变红。
# ============================================================

on:
  push:
    branches: [main]
  pull_request:

# 同一分支上连续 push 时，取消上一次还没跑完的检查：
# 旧提交的结论已经没有意义，让它占着 runner 只是拖慢新提交的反馈。
concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

# CI 只需要读代码
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------
  # 后端：vet + 全量测试
  # ----------------------------------------------------------
  backend:
    name: 后端检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          # 读 backend/go.mod 的 go 指令（当前 1.25.0）。
          # 不在 workflow 里另写一个版本号：两处写死的结果必然是漂移，
          # 而「CI 用的 Go 版本与项目声明的不一致」会造成只有 CI 才复现的编译错误。
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        working-directory: backend
        run: |
          set -euo pipefail
          # vet 抓的是编译器不管、但几乎总是 bug 的东西
          # （printf 参数不匹配、锁被复制、不可达代码……）。它比测试快得多，
          # 放在测试前面，让最廉价的问题最先暴露。
          # 注意：vet 会真的做类型检查，编译不过的代码在这里就会失败。
          go vet ./...

      - name: go test
        working-directory: backend
        run: |
          set -euo pipefail
          # -race 打开竞态检测：这个项目是并发中转服务，锁用错、
          # 共享 map 并发读写这类问题平时不显形，只在压力下偶发，
          # 而 CI 是最适合把它们逼出来的地方。
          # CGO_ENABLED=1 是 -race 的硬性要求（race detector 依赖 cgo）。
          CGO_ENABLED=1 go test -race ./...

  # ----------------------------------------------------------
  # 前端：类型检查 + 构建
  # ----------------------------------------------------------
  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: |
          set -euo pipefail
          # npm ci 严格按 lockfile 安装（可复现），不更新 lockfile
          npm ci

      - name: 类型检查
        working-directory: frontend
        run: |
          set -euo pipefail
          # vue-tsc --noEmit：类型错误在构建时常被 esbuild 直接跳过
          # （vite build 只转译、不做类型检查），必须单独跑这一条才能拦住。
          npm run type-check

      - name: 构建
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run build

      - name: 契约检查
        working-directory: frontend
        run: |
          set -euo pipefail
          # check-contracts.mjs 静态比对每个页面的 DataState 用法与组件 props 声明。
          # 它拦的是那类「只在开发期控制台警告、构建产物里被剥掉、测试也不看」
          # 的静默错误（历史上 ProxiesView 的属性写错很久没人发现）。
          # 该脚本在本仓库已跑通（exit 0），注意必须在 frontend/ 下执行：
          # 它按 import.meta.url 相对定位到 ../src。
          node scripts/check-contracts.mjs
