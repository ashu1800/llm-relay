# LLM Relay 本地部署编排
# 说明：postgres 仅在内部网络暴露，不映射到宿主端口，
#       以避免与宿主机上已有的 5432 / 6379（sub2api 在用）冲突。
name: llm-relay

services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-relay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-llmrelay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-llm_relay}
      TZ: UTC
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-llmrelay} -d ${DB_NAME:-llm_relay}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [relay]

  # 这里曾经挂过一个 redis 容器，但后端从未接入任何 Redis 客户端
  # （go.mod 里没有依赖，main.go 也不连接），它只是占资源、多一个故障面。
  # 将来真要加缓存时再连回来，那时记得同时补上真实使用。

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: llm-relay:local
    container_name: llm-relay
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8888
      # 渠道密钥的加密主密钥。缺失会退回内置默认值（公开可知），
      # 因此这里不给默认值，让配置缺失在安装阶段就暴露出来。
      RELAY_SECRET: ${RELAY_SECRET:?请在 .env 中设置 RELAY_SECRET}
      GIN_MODE: release
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-llmrelay}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-llm_relay}
      DB_SSLMODE: disable
      PRICING_UPDATE_INTERVAL_HOURS: ${PRICING_UPDATE_INTERVAL_HOURS:-24}
      PRICING_OFFICIAL_SYNC_ENABLED: ${PRICING_OFFICIAL_SYNC_ENABLED:-true}
      PRICING_PROXY_URL: ${PRICING_PROXY_URL:-}
      RELAY_PAYLOAD_STORAGE_MODE: ${RELAY_PAYLOAD_STORAGE_MODE:-errors}
      RELAY_PAYLOAD_MAX_KB: ${RELAY_PAYLOAD_MAX_KB:-256}
      RELAY_MAX_CONCURRENCY: ${RELAY_MAX_CONCURRENCY:-64}
      RELAY_DEFAULT_RPM: ${RELAY_DEFAULT_RPM:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 仅绑定 127.0.0.1 也足够（WSL2 localhost 转发），如需局域网访问改为 "8888:8888"
      - "${BIND_ADDR:-0.0.0.0}:8888:8888"
    volumes:
      - ./data/relay:/data
    networks: [relay]

networks:
  relay:
    driver: bridge
