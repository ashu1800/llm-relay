# LLM Relay 本地部署编排
# 说明：postgres 仅在内部网络暴露，不映射到宿主端口，
#       以避免与宿主机上已有的 5432 / 6379（sub2api 在用）冲突。
name: llm-relay

services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-relay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-llmrelay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-llm_relay}
      TZ: UTC
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # 日志轮转。Docker 默认的 json-file 驱动**没有上限**：
    # 这个服务是长跑的，请求日志 + postgres 输出会持续写进
    # /var/lib/docker/containers/<id>/*-json.log，几个月就能吃掉几十 GB，
    # 而磁盘满的表现是数据库先崩，根因却在一个没人会想到的日志文件上。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # 用 pg_isready 但不带 -U/-d：带用户名时它会尝试实际认证，
      # 而这里只需要判断「服务是否接受连接」。认证失败与「服务没起来」
      # 会返回不同的退出码，健康检查若把认证失败也算不健康，
      # 容器就会在凭据轮换期间被反复重启。
      #
      # 另外必须显式指定宿主：默认走 Unix socket，而官方镜像的 socket
      # 在容器内是通的，这里保留 -h 127.0.0.1 让它走 TCP，
      # 与后端连接方式一致（后端也是 TCP），避免「socket 通了 TCP 没通」
      # 这种健康但不可用的情况。
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [relay]

  # 这里曾经挂过一个 redis 容器，但后端从未接入任何 Redis 客户端
  # （go.mod 里没有依赖，main.go 也不连接），它只是占资源、多一个故障面。
  # 将来真要加缓存时再连回来，那时记得同时补上真实使用。

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: llm-relay:local
    container_name: llm-relay
    restart: unless-stopped
    # 停机宽限期：默认 10 秒，而这里的 app 是 Go 写的、收到 SIGTERM 立刻退出，
    # 正常情况 1 秒内就停完了。留 5 秒是给「正在处理的请求」收尾，
    # 同时把最坏情况（进程卡住）从 10 秒压到 5 秒 —— 每次重新部署都要停一次它。
    stop_grace_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8888
      # 渠道密钥的加密主密钥。缺失会退回内置默认值（公开可知），
      # 因此这里不给默认值，让配置缺失在安装阶段就暴露出来。
      RELAY_SECRET: ${RELAY_SECRET:?请在 .env 中设置 RELAY_SECRET}
      GIN_MODE: release
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-llmrelay}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-llm_relay}
      DB_SSLMODE: disable
      RELAY_PAYLOAD_STORAGE_MODE: ${RELAY_PAYLOAD_STORAGE_MODE:-errors}
      RELAY_PAYLOAD_MAX_KB: ${RELAY_PAYLOAD_MAX_KB:-256}
      RELAY_MAX_CONCURRENCY: ${RELAY_MAX_CONCURRENCY:-64}
      RELAY_DEFAULT_RPM: ${RELAY_DEFAULT_RPM:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 默认只绑宿主机回环（原因与改法见 .env.example 的 BIND_ADDR 注释）
      # 容器内 SERVER_HOST 始终是 0.0.0.0，这里限制的是宿主机侧的端口发布
      - "${BIND_ADDR:-127.0.0.1}:8888:8888"
    volumes:
      - ./data/relay:/data
    # 同 postgres：不限的话 json-file 会无限增长
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 用 /readyz 而不是 /healthz：healthz 只说明进程活着，
    # 而这里真正要判断的是「能不能接请求」—— 数据库连不上时
    # 进程活得好好的（healthz 返回 200），但每个请求都会 500。
    # readyz 会实际探一次数据库，那才是这个容器该有的健康定义。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 3 http://127.0.0.1:8888/readyz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 启动时要跑迁移，给足时间再开始判失败
      start_period: 40s
    networks: [relay]

networks:
  relay:
    driver: bridge
