# LLM Relay 本地部署编排
# 说明：app 用 host 网络模式（见 app 段的注释），postgres 在宿主回环上
# 发布 15432 专用端口供它连接 —— 不用 5432，那个端口已被宿主上原有的
# postgres（sub2api 在用）占用。
name: llm-relay

services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-relay-postgres
    restart: unless-stopped
    ports:
      # host 模式的 app 要经 127.0.0.1 连数据库，而 postgres 原先只在内部
      # 网络暴露。发布到 15432（不是 5432：宿主上已有原生 postgres）。
      # 这个映射只在 postgres 容器自身重建时才会重新发布 —— 那是几个月
      # 一次的事，不像 app 那样每次部署都动，所以不会反复触发
      # Windows↔WSL localhost 转发断连的问题。
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-llmrelay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-llm_relay}
      TZ: UTC
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # 日志轮转。Docker 默认的 json-file 驱动**没有上限**：
    # 这个服务是长跑的，请求日志 + postgres 输出会持续写进
    # /var/lib/docker/containers/<id>/*-json.log，几个月就能吃掉几十 GB，
    # 而磁盘满的表现是数据库先崩，根因却在一个没人会想到的日志文件上。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # 用 pg_isready 但不带 -U/-d：带用户名时它会尝试实际认证，
      # 而这里只需要判断「服务是否接受连接」。认证失败与「服务没起来」
      # 会返回不同的退出码，健康检查若把认证失败也算不健康，
      # 容器就会在凭据轮换期间被反复重启。
      #
      # 另外必须显式指定宿主：默认走 Unix socket，而官方镜像的 socket
      # 在容器内是通的，这里保留 -h 127.0.0.1 让它走 TCP，
      # 与后端连接方式一致（后端也是 TCP），避免「socket 通了 TCP 没通」
      # 这种健康但不可用的情况。
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [relay]

  # 这里曾经挂过一个 redis 容器，但后端从未接入任何 Redis 客户端
  # （go.mod 里没有依赖，main.go 也不连接），它只是占资源、多一个故障面。
  # 将来真要加缓存时再连回来，那时记得同时补上真实使用。

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: llm-relay:local
    container_name: llm-relay
    restart: unless-stopped
    # host 网络模式 —— 这是为了根治「每次部署后浏览器打不开 localhost:8888」。
    #
    # 桥接模式下 ports: 发布宿主端口这个动作本身会打断 Windows↔WSL 的
    # localhost 转发（wslrelay.exe）：每次部署重建 app 容器，8888 的
    # docker-proxy 就跟着重建，转发随之失效 —— 表现是服务其实健康
    # （WSL 里 curl 通），但 Windows 浏览器一直转圈。2026-09-20 两天里
    # 实测触发两次，第二次把用户逼得 wsl --shutdown（服务真停 30 秒）。
    # 预检端口（8899）已因此移除，但重建 app 本身仍会触发 —— 治本只能
    # 让 app 的宿主端口发布动作彻底消失。
    #
    # host 模式下进程直接监听宿主的 8888，没有 docker-proxy、没有端口
    # 发布，容器随便重建，转发不再被动到。代价与对策：
    #   · 隔离性：进程看到的是宿主网络栈 —— 本地个人部署，可接受；
    #     「只绑回环」的安全限制改由 SERVER_HOST 承担（见 environment）
    #   · 端口冲突：8888 被占会导致容器反复重启 —— docker logs 一眼可见
    #   · 数据库地址：不再是服务名 postgres，改成 127.0.0.1:15432
    #     （postgres 现在把 5432 发布到宿主回环的 15432）
    #   · 依赖排序：depends_on 的 service_healthy 仍有效（同机 compose），
    #     但 app 连的是 127.0.0.1 而非容器 DNS —— 启动竞态由 postgres 的
    #     健康检查 + app 自己的重连兜住
    network_mode: host
    # 停机宽限期。这个值必须**大于**进程自己的退出预算，否则容器会被 SIGKILL，
    # 那时连「已退出」那行日志和队列里最后几条请求日志都留不下来。
    # 进程侧预算是（见 backend/cmd/server/main.go 顶部的常量）：
    #   等在途请求收尾 3s + 等日志队列写完 1.5s + 关预连接 0.5s ≈ 5s
    # 原来这里写 5s，注释里的假设是「Go 收到 SIGTERM 立刻退出，正常 1 秒内停完」——
    # 那个假设是错的，实测过一次中断 6511ms（.shots/measure-swap.sh）：
    # Go 的 Shutdown 对「连上了但还没发请求头」的连接有 5 秒特判（issue 22682），
    # 浏览器预连接正是这种，于是每次都停满 5 秒再被 SIGKILL。
    # 现在进程侧会主动关掉那批连接，正常应在 2 秒内退干净；留 8 秒是给
    #「恰好有长回答在途」的兜底 —— 那种情况本来就该让它把话说完。
    stop_grace_period: 8s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # host 模式下这就是**宿主侧**的实际绑定地址（没有 docker-proxy 转译了）。
      # 部署到公网时改 0.0.0.0 前必须先设好 RELAY_ADMIN_KEY（登录鉴权），
      # 并建议加反向代理 + HTTPS。
      SERVER_HOST: ${SERVER_HOST:-127.0.0.1}
      SERVER_PORT: 8888
      # 渠道密钥的加密主密钥。缺失会退回内置默认值（公开可知），
      # 因此这里不给默认值，让配置缺失在安装阶段就暴露出来。
      RELAY_SECRET: ${RELAY_SECRET:?请在 .env 中设置 RELAY_SECRET}
      # 管理台登录密钥。留空表示关闭登录鉴权（旧部署兼容），
      # 但启动日志与界面横幅会持续提醒；公网部署必须设置。
      RELAY_ADMIN_KEY: ${RELAY_ADMIN_KEY:-}
      # 登录会话有效期（默认 168h）与可信反向代理（默认只信回环）
      RELAY_SESSION_TTL: ${RELAY_SESSION_TTL:-168h}
      SERVER_TRUSTED_PROXIES: ${SERVER_TRUSTED_PROXIES:-127.0.0.1,::1}
      GIN_MODE: release
      # host 模式下没有容器 DNS，数据库走宿主回环的 15432
      # （postgres 把 5432 发布在那里，见 postgres 段的注释）
      DB_HOST: 127.0.0.1
      DB_PORT: ${DB_HOST_PORT:-15432}
      DB_USER: ${DB_USER:-llmrelay}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-llm_relay}
      DB_SSLMODE: disable
      RELAY_PAYLOAD_STORAGE_MODE: ${RELAY_PAYLOAD_STORAGE_MODE:-errors}
      RELAY_PAYLOAD_MAX_KB: ${RELAY_PAYLOAD_MAX_KB:-256}
      RELAY_MAX_CONCURRENCY: ${RELAY_MAX_CONCURRENCY:-64}
      RELAY_DEFAULT_RPM: ${RELAY_DEFAULT_RPM:-0}
      # 故障转移到同一台上游时的等待（详见 .env.example 的说明）
      RELAY_RETRY_SAME_UPSTREAM_DELAY: ${RELAY_RETRY_SAME_UPSTREAM_DELAY:-500ms}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      TZ: ${TZ:-Asia/Shanghai}
    # 注意：host 模式下**没有 ports 段** —— 进程直接监听宿主 8888。
    # 「只绑回环、不暴露局域网」的限制改由 SERVER_HOST 承担（见 environment），
    # 默认 127.0.0.1 与原先 ports 的回环绑定同义。
    volumes:
      - ./data/relay:/data
    # 同 postgres：不限的话 json-file 会无限增长
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 用 /readyz 而不是 /healthz：healthz 只说明进程活着，
    # 而这里真正要判断的是「能不能接请求」—— 数据库连不上时
    # 进程活得好好的（healthz 返回 200），但每个请求都会 500。
    # readyz 会实际探一次数据库，那才是这个容器该有的健康定义。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 3 http://127.0.0.1:8888/readyz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 启动时要跑迁移，给足时间再开始判失败
      start_period: 40s
    # 注意：network_mode: host 与 networks 互斥（compose 会拒绝），
    # app 不声明网络 —— 数据库走宿主回环 15432，不再走 compose 内部 DNS

networks:
  relay:
    driver: bridge
