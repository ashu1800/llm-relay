# llm.ashu180.cn —— 36.137.140.126 上的反代（TLS 终止 + 转发 + 真实客户端 IP）
#
# 与同目录 llm.ashu180.cn.conf 的唯一区别：监听 9443 而不是 443。
# 原因：36.137.140.126 的 80/443/8080/8443 被厂商按「未备案网站」拦截
# （2026-10-29 实测：这四个端口外部探测超时，9443/9000/12345 等其余端口
# 正常放行），所以域名只能落在非标端口上。
#
# 代价：浏览器地址栏必须带 `:9443`，隐式 443 永远打不开 —— 这是端口限制，
# 不是证书问题。客户端（含 API 基地址）要写成 https://llm.ashu180.cn:9443/v1。
#
# 证书：acme.sh + 阿里云 DNS（dns_ali），续期只能走 DNS-01 —— 80 端口被封，
# HTTP-01 的 /.well-known 挑战打不进来。续期细节见本目录 README。
#
# 安装位置：/etc/nginx/sites-available/llm.ashu180.cn

server {
    listen      9443 ssl;
    listen      [::]:9443 ssl;
    http2       on;
    server_name llm.ashu180.cn;

    ssl_certificate         /etc/nginx/ssl/llm.ashu180.cn/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/llm.ashu180.cn/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/llm.ashu180.cn/fullchain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:LLMSSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # 管理密钥是明文提交的表单字段，HSTS 掐掉「降级回 http 再被劫持」这条路。
    # 不写 includeSubDomains / preload：同域还有别的服务（glm 等），不替整站立规矩。
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header Referrer-Policy           "same-origin"    always;

    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;

        # 用 $http_host 而不是 $host：$host 会丢掉非默认端口，而浏览器发来的
        # Origin 是 https://llm.ashu180.cn:9443。port 属于 Host 的一部分
        # （backend/internal/api/middleware.go sameOriginMatches 严格比端口），
        # 丢端口会让管理接口全部 403 —— 443 端口上看不出这个问题，非标端口必踩。
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket：管理台实时看板 /api/admin/live。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 流式：缓冲会把整段回答攒到最后一次性吐出，首包时间退化成完整上游耗时。
        proxy_buffering off;
        proxy_cache     off;
        proxy_request_buffering off;

        # 后端 RELAY_UPSTREAM_TIMEOUT=300s，反代必须比它长。
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}
