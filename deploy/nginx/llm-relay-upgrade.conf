# WebSocket 升级头映射（http 上下文，nginx.conf 会 include conf.d/*.conf）。
#
# 直接写 proxy_set_header Connection "upgrade" 是错的：普通请求没有 Upgrade
# 头，却会被声明成 upgrade，上游看到的是一个永远等不到 101 的连接。
# 用 map 让「有 Upgrade 才 upgrade，没有就 close」。
#
# 安装位置：/etc/nginx/conf.d/llm-relay-upgrade.conf
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
