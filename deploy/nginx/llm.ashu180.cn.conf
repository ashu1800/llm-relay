# llm.ashu180.cn —— LLM Relay 反向代理
#
# 分工：nginx 只做 TLS 终止 + 转发 + 真实客户端 IP 透传。
# 不启用 gzip、不做静态缓存：后端 backend/internal/api/static.go 已在构建期把
# 前端产物预压缩成 .gz 一并 embed，运行时按 Accept-Encoding 直接下发压缩体，
# 并自带 Cache-Control（带哈希的 /assets/* 是 immutable 一年，index.html 走
# ETag 校验）。反代再压一遍是在这台 2 核机器上白烧 CPU，还会与上游已经带上的
# Content-Encoding 打架。
#
# 证书：certbot / Let's Encrypt，到期 2026-12-28。续期走 webroot
# （/etc/letsencrypt/renewal/llm.ashu180.cn.conf 里 authenticator = webroot），
# 挑战文件由下面 80 端口的 /.well-known/acme-challenge/ 提供，不占用端口。
#
# 安装位置：/etc/nginx/sites-available/llm.ashu180.cn
#          + ln -s 到 /etc/nginx/sites-enabled/

server {
    listen      80;
    listen      [::]:80;
    server_name llm.ashu180.cn;

    # ACME HTTP-01 挑战目录。只映射 .well-known，不暴露 /var/www 其它内容。
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
        access_log   off;
    }

    # 其余一律跳 HTTPS（保留 host 与 path，管理台深链接刷新后不会掉回 http）。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24：HTTP/2 只能靠 listen 参数开启（`http2 on;` 要 1.25.1+）。
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name llm.ashu180.cn;

    ssl_certificate         /etc/letsencrypt/live/llm.ashu180.cn/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/llm.ashu180.cn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/llm.ashu180.cn/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:LLMSSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # 管理密钥是明文提交的表单字段，HSTS 掐掉「降级回 http 再被劫持」这条路。
    # 不写 includeSubDomains / preload：这台机器上还有别的服务，不替整站立规矩。
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header Referrer-Policy           "same-origin"    always;

    # 比 .env 的 RELAY_MAX_REQUEST_BODY_MB=32 留出余量：超限时让后端回它自己的
    # JSON 错误体，而不是被 nginx 用一张 HTML 错误页拦下。
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;

        # 真实客户端 IP：后端 SERVER_TRUSTED_PROXIES=127.0.0.1,::1 才肯采信
        # X-Forwarded-For，登录限流按 IP 计数依赖它。
        # X-Forwarded-Proto 必须发 https，会话 Cookie 才会带 Secure
        # （backend/internal/api/console_auth.go:162）。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket：管理台实时看板 /api/admin/live。
        # 服务端每 25s 发一次心跳（backend/internal/api/live.go:136），
        # read_timeout 600s 足以覆盖。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 流式：一旦缓冲，整段回答会攒到最后一次性吐出，首包时间直接退化成
        # 一个完整的上游耗时。
        proxy_buffering off;
        proxy_cache     off;

        # 请求体直传上游，不在 nginx 落临时磁盘文件（磁盘只剩 71%）。
        proxy_request_buffering off;

        # 后端 RELAY_UPSTREAM_TIMEOUT=300s、RELAY_FIRST_BYTE_TIMEOUT=120s，
        # 反代必须比它们长，否则先断的是 nginx 而不是后端。
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}
