# magpie.ashu180.cn —— 36.137.140.126 上的反代（TLS 终止 → magpie 页面）
#
# magpie 用 `magpie serve --web=127.0.0.1:3430` 同时提供网页与网关：
# 页面端口（3430）也回答网关的客户端路由（/v1/…、/v1beta/…、/mcp/…），
# 所以这里只写一个 location，全部交给 3430。详见 magpie 的 docs/reference.md
# 「Connecting anything else」。
#
# 端口 9443 与 llm.ashu180.cn 共用：同一个 listen，SNI + server_name 分流。
# 80/443/8080/8443 在这台机器上被厂商按「未备案网站」拦截，只有非标端口可用。
#
# 证书：acme.sh + 阿里云 DNS（dns_ali），DNS-01 续期（80 端口被封，HTTP-01 不通）。
#
# 安装位置：/etc/nginx/sites-available/magpie.ashu180.cn

server {
    listen      9443 ssl;
    listen      [::]:9443 ssl;
    http2       on;
    server_name magpie.ashu180.cn;

    ssl_certificate         /etc/nginx/ssl/magpie.ashu180.cn/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/magpie.ashu180.cn/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/magpie.ashu180.cn/fullchain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:MAGPIESSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header Referrer-Policy           "same-origin"    always;

    # 模型请求的 body 可能比网关的普通请求大（长上下文），留足余量。
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3430;
        proxy_http_version 1.1;

        # $http_host 保留端口：magpie 按 Host/Origin 发会话 Cookie，非标端口
        # 丢了端口会让登录态与页面来源对不上（同 llm 那份的坑）。
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # magpie 把「带转发头」的请求当作来自另一台机器：需要网关密钥，
        # 这正是对外暴露时要的语义，别删掉这一行。
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 页面里的实时更新走 WebSocket。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 模型响应是 SSE：缓冲会把整段回答攒到最后一次性吐出。
        proxy_buffering         off;
        proxy_request_buffering off;

        # 上游慢生成时别让 nginx 先断。
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}
