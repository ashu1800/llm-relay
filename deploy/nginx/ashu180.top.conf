# ashu180.top + www.ashu180.top —— llm-relay 的标准端口入口（80 / 443）
#
# 与 llm.ashu180.cn-9443.conf 的区别：监听 80/443 而不是 9443。
# 这两个端口目前被厂商按「未备案」拦截（2026-10-31 复测仍超时），这里先把
# nginx 监听与证书备好：厂商一旦放行，无需再动服务器即可访问。
#
# 证书：acme.sh + 阿里云 DNS（dns_ali），DNS-01（80 被封时 HTTP-01 也走不通），
# 一张证书带 SAN：ashu180.top + www.ashu180.top。
#
# 安装位置：/etc/nginx/sites-available/ashu180.top

server {
    listen      80;
    listen      [::]:80;
    server_name ashu180.top www.ashu180.top;

    # ACME HTTP-01 挑战目录：证书改走 HTTP-01 时不用再改配置。
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
        access_log   off;
    }

    # 其余一律跳 HTTPS（保留 host 与 path）。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name ashu180.top www.ashu180.top;

    ssl_certificate         /etc/nginx/ssl/ashu180.top/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/ashu180.top/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/ashu180.top/fullchain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:TOPSSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "same-origin" always;

    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;

        # 默认端口也带 $http_host：后端 sameOriginOnly 比 Origin 的 host:port，
        # 443/80 虽然是默认端口，但浏览器不带端口、$host 也不带，两边一致；
        # 用 $http_host 是为了以后换端口时不踩这个坑。
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket：管理台实时看板 /api/admin/live。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}
