<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 站点图标：主色取自 styles/theme.css 里的 primary 色（#c87864）。
       图形是「中继」本身 —— 一个点把一个请求交给另一个点。
       刻意不画字母：16px 下字母会糊成一团，两个圆点加一个箭头仍然分得清。

       注意：XML 注释里不能出现连续两个减号，所以这里不写 CSS 变量名 ——
       写了会让整个 SVG 解析失败，浏览器直接把源码当文本显示（实测踩过）。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98a74" />
      <stop offset="1" stop-color="#a95a45" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)" />
  <circle cx="8.6" cy="16" r="2.7" fill="#fff" />
  <path d="M13.2 16h5.4" stroke="#fff" stroke-width="2.4" stroke-linecap="round" />
  <path d="M18.2 12.3 22.6 16l-4.4 3.7" fill="none" stroke="#fff" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="25.6" cy="16" r="2.1" fill="#fff" fill-opacity="0.72" />
</svg>
