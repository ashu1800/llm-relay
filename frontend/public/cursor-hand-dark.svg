<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- 深色主题的手型光标（链接、按钮、开关、下拉这类可点元素）。
       浅色那套是 cursor-hand-light.svg。

       同一族（食指 + 拳 + 拇指），风格差异放在三处：
         1. 全圆弧收口：浅色是直边 + 一个大圆角掌心，这里每个拐角都是圆弧
         2. 拳侧一道指节凹口（浅色那一侧是平直的）
         3. 拇指是一个圆钝的弧瓣（浅色是两段三次曲线拧出来的尖拇指）

       凹口是它缩到 16px 还能被认成「手」而不是一团色块的关键 ——
       浅色那份文件里记着这条教训，两套都必须留。

       食指的 x 跨度 7.4~10.8、圆角半径 1.7、指尖顶点 y 2.6，与浅色那份
       逐字相同 —— 热区在两边都是 9 2，切主题不会让点击落点跳。
       两套共用食指几何是刻意的：热区一致必须有几何依据，
       否则「热区相同」就只是一句注释里的承诺。

       这条 d 是手工排的圆弧，没有用脚本生成：试过「所有顶点按半径自动倒圆角」，
       结果每个角都被相邻边的长度夹住，整只手糊成一个椭圆。
       圆角的硬约束是「每条边长 > 两端半径之和」，所以这里逐段写死。

       约束与配色理由同 cursor-arrow-dark.svg（width/height 必填、
       不超过 32x32、注释里不能有连续两个减号、颜色只能写字面量；
       填充与描边取自深色主题「主色实心块」的那一对）。 -->
  <path
    d="M7.4 11.4 V4.3 a1.7 1.7 0 0 1 3.4 0 V10.8 H15.4
       a3 3 0 0 1 3 3 V15.6 L17 16.7 L18.4 17.8 V18.4
       a3 3 0 0 1 -3 3 H9.4 a3.4 3.4 0 0 1 -3.4 -3.4
       Q3 15 5.6 12.8 L7.4 11.4 Z"
    fill="#e8a48c"
    stroke="#3a241d"
    stroke-width="1.5"
    stroke-linejoin="round" />
</svg>
