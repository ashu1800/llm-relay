<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- 浅色主题的默认光标：经典锐角箭头轮廓。

       本项目每个主题各有一套光标（深色是 cursor-arrow-dark.svg，换了一套
       圆角轮廓）。两套的尖端坐标与热区必须逐字一致，切主题不能改变点击落点。

       三个硬性约束，改这个文件前先看一眼：
       1. width / height 必须显式写着。Chrome 拿不到固有尺寸时不会渲染光标，
          也不报错，表现只是「改了样式没效果」。
       2. 图形不超过 32x32。Firefox 67 起对自定义光标的上限就是 32x32
          （见 MDN 上 cursor 的兼容性注记），超了会被直接丢弃。
       3. 注释里不能出现连续两个减号，所以这里不能写那个 CSS 变量名。
          写了会让整个 SVG 解析失败，浏览器把源码当文本显示 ——
          与 public/favicon.svg 记的是同一个坑，第一版就踩了一次。

       颜色只能写字面量：这个文件是当作图片加载的，没有 CSS 级联，
       样式表里的变量在这里不存在。#b15840 是浅色主题里「主色实心块」
       的底色（按钮底色与品牌标记底色共用同一个值），#ffffff 是压在上面
       的文字色 —— 取这一对而不是主色本身，是因为主色 #c87864 压在米白
       页底上只有 3.05:1，而加深这一档有 4.44:1（白卡片上 4.84:1）。
       这两个值在 theme.css 里必然有第二份，frontend/scripts/check-contracts.mjs
       里有一组检查盯着两处一致。 -->
  <path
    d="M2 2 L2 20 L6.6 15.6 L9.6 22 L12.4 20.7 L9.5 14.4 L15.6 14 Z"
    fill="#b15840"
    stroke="#ffffff"
    stroke-width="1.5"
    stroke-linejoin="round" />
</svg>
