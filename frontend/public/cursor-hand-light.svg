<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- 浅色主题的手型光标（链接、按钮、开关、下拉这类可点元素）。
       深色主题那套是 cursor-hand-dark.svg，轮廓不同、食指位置相同。

       形状是「食指 + 握起的拳 + 拇指」三块的并集轮廓。食指两侧与拇指上方
       各留一个凹口，这是它缩到 16px 还能被认成「手」而不是一团色块的关键 ——
       少了凹口就只剩一根棒子顶个圆球。拇指那道凹口特意用两段直线而不是
       平滑相切：相切时两个面几乎共线，缩到 24px 就看不见了。
       热区取食指指尖（样式表里写 9 2），不是图形左上角。

       约束与配色理由同 cursor-arrow-light.svg（width/height 必填、
       不超过 32x32、注释里不能有连续两个减号、颜色只能写字面量；
       填充与描边取自浅色主题「主色实心块」的那一对）。 -->
  <path
    d="M7.4 11.4 V4.3 a1.7 1.7 0 0 1 3.4 0 V10.8 H15.4
       a3.2 3.2 0 0 1 3.2 3.2 V18 a3.4 3.4 0 0 1 -3.4 3.4 H9.6
       a3.4 3.4 0 0 1 -3.4 -3.4 V17.6
       c-1.5 -.2 -2.7 -1.5 -2.7 -3.1 c0 -1.2 1 -2.2 2.2 -2.2
       l1.7 -.9 Z"
    fill="#b15840"
    stroke="#ffffff"
    stroke-width="1.5"
    stroke-linejoin="round" />
</svg>
