<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- 深色主题的默认光标。浅色那套是 cursor-arrow-light.svg。

       两套刻意用不同的轮廓风格，不只是换色：
         * 浅色（cursor-arrow-light.svg）：长而窄、全锐角，13.6 宽 × 20.0 高（高宽比 1.47）
         * 深色（本文件）：        短而阔、全圆角，14.1 宽 × 16.8 高（高宽比 1.19）
       并列时一眼能分出是两套，而不是「同一个图形改了个色」。
       这两个尺寸是用浏览器 getBBox() 量的（.shots/measure-cursors.mjs），
       不是照着 d 里的数字手算的 —— 圆弧的极值不在命令端点上，手算会错。

       尖端仍在 (2,2)，与浅色逐字相同 —— 两套的热区都是 2 2。
       热区必须一致：切主题时点击落点跟着变的话，用户会以为点歪了。

       圆角是脚本算出来的（直线 + 圆弧 A），不是手写的近似贝塞尔：
       24px 下圆角差零点几个像素看不出来，但会让两套的圆角半径不一致。
       生成器在 .shots/gen-cursor-dark.mjs（那个目录不入库），
       形状若有调整，改生成器里的顶点表再跑一次带写回参数的命令，别在这里手改坐标。
       （具体参数看脚本里的 process.argv 分支，这里不写出来：
       注释里出现连续两个减号会让整个 SVG 解析失败，契约检查盯着这条。）

       三个硬性约束：width/height 必须显式写着（Chrome 拿不到固有尺寸时
       不渲染光标，也不报错）；不超过 32x32（Firefox 67 上限）；
       注释里不能有连续两个减号（会让整个 SVG 解析失败）。

       颜色只能写字面量：这个文件是当作图片加载的，没有 CSS 级联。
       #e8a48c 是深色主题里「主色实心块」的底色，#3a241d 是压在上面的
       文字色 —— 深色主题下必须是亮底 + 深字（深色底上放深色块，
       块本身相对卡片只有 2.73:1 的轮廓对比，会糊进背景）。
       这两个值在 theme.css 里必然有第二份，
       frontend/scripts/check-contracts.mjs 里有一组检查盯着两处一致。 -->
  <path
    d="M16.07 11.42 A1.4 1.4 0 0 1 15.83 12.27 L11.4 12.49 A1 1 0 0 0 10.92
       13.4 L12.98 16.79 A1.3 1.3 0 0 1 12.42 18.33 L11.74 18.57 A1.3 1.3 0 0 1
       9.83 17.89 L7.68 14.41 A1 1 0 0 0 6.34 14.15 L3.21 16.42 A1.5 1.5 0 0 1
       2 15.8 L2 2 L16.07 11.42 Z"
    fill="#e8a48c"
    stroke="#3a241d"
    stroke-width="1.5"
    stroke-linejoin="round" />
</svg>
